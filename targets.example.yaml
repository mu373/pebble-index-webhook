version: 1

targets:
  # Example receiver that accepts the normalized event and optional audio attachment.
  - name: audio-event-receiver
    enabled: true
    url: https://receiver.example.com/events
    timeout_seconds: 30
    auth:
      header: Authorization
      scheme: Bearer
      token_env: RECEIVER_TOKEN
    request:
      body_format: multipart
      event_field: event
      audio_field: audio
      audio_filename: index-recording.m4a
      audio_mime_type: audio/mp4
      include_audio: true
      template: |
        {
          "event_id": {{ event.event_id | tojson }},
          "source": {{ event.source | tojson }},
          "sender_id": {{ event.sender_id | tojson }},
          "conversation_id": {{ event.conversation_id | tojson }},
          "content": {{ event.content | tojson }},
          "reply": {{ event.reply | tojson }},
          "metadata": {{ event.metadata | tojson }}
        }
    status:
      url_template: https://receiver.example.com/events/{id}
      id_field: id

  # JSON-only targets can receive metadata or notifications without the audio file.
  # Slack Incoming Webhook URLs are secrets, so load the URL from the environment.
  - name: slack-receipt
    enabled: false
    url_env: SLACK_WEBHOOK_URL
    request:
      body_format: json
      include_audio: false
      template: |
        {
          "text": {{ ("Pebble input received: " ~ event.event_id) | tojson }}
        }

  # Enable this entry to fan the same Pebble event out to another HTTP service.
  - name: example-webhook
    enabled: false
    url: https://receiver.example.com/hooks/pebble
    headers:
      X-Event-Source: pebble-index
    auth:
      header: X-API-Key
      scheme: ""
      token_env: EXAMPLE_WEBHOOK_TOKEN
    request:
      body_format: multipart
      event_field: payload
      audio_field: recording
      audio_filename: pebble-recording.m4a
      audio_mime_type: audio/mp4
      include_audio: true
      template: |
        {
          "id": {{ event.event_id | tojson }},
          "sender": {{ event.sender_id | tojson }},
          "content": {{ event.content | tojson }},
          "recorded_at": {{ event.metadata.recorded_at | tojson }}
        }
